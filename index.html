<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>日用品の在庫管理</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <main id="main-content">
      <section id="inventory" class="screen" aria-labelledby="inventory-title">
        <h1 id="inventory-title">在庫</h1>
        <p id="inventory-message" class="field-help" role="status">読み込み中…</p>
        <div id="inventory-list" class="product-list"></div>
        <template id="inventory-card-template">
          <article class="product-card inventory-card">
            <button type="button" class="card-more" aria-expanded="false">…</button>
            <div class="product-image" aria-hidden="true"></div>
            <div class="product-details"><h2><span class="item-name"></span><span class="shopping-target" hidden>買い物対象</span></h2><p class="category"></p><div class="product-meta"><span class="stock-label"></span><span class="reorder-label"></span></div></div>
            <div class="quantity-control" role="group"><button type="button" class="decrease-button">−</button><span class="quantity"><span class="quantity-value"></span><span class="quantity-unit">個</span></span><button type="button" class="increase-button">＋</button></div>
            <p class="card-error field-error" role="alert" hidden></p><div class="card-delete-action" hidden><button type="button" class="card-edit">商品情報を編集する</button><button type="button" class="card-delete">このカードを削除する</button></div>
          </article>
        </template>
      </section>
      <section id="shopping" class="screen" aria-labelledby="shopping-title" hidden>
        <h1 id="shopping-title">買い物リスト</h1>
        <div id="shopping-progress" hidden><p id="shopping-count"></p><progress id="shopping-bar" max="1" value="0" aria-label="買い物の進捗"></progress><p id="shopping-complete" hidden>すべてチェック済みです！</p></div>
        <p id="shopping-message" class="field-help" role="status">読み込み中…</p>
        <div id="shopping-list" class="product-list"></div>
        <template id="shopping-card-template">
          <article class="product-card shopping-card">
            <div class="product-image" aria-hidden="true"></div>
            <div class="product-details"><h2><span class="item-name"></span></h2><p class="category"></p><div class="product-meta"><span class="stock-label"></span><span class="reorder-label"></span></div></div>
            <div class="basket-control"><label class="checkbox-hit"><input type="checkbox"></label><span>かごに<br>入れた</span><p class="check-error field-error" role="alert" hidden></p></div>
          </article>
        </template>
      </section>
      <section id="add" class="screen" aria-labelledby="add-title" hidden>
        <h1 id="add-title">商品追加</h1>
        <div id="add-form" class="add-form" role="group" aria-labelledby="add-title">
          <div class="form-field"><label for="product-name">商品名</label><input id="product-name" aria-describedby="name-error" disabled name="product-name" type="text" placeholder="例：キッチンペーパー"><p id="name-error" class="field-error" role="alert" hidden></p></div>
          <div class="form-field"><label for="product-category">カテゴリ</label><select id="product-category" disabled name="product-category" aria-describedby="category-error"></select><p id="category-error" class="field-error" role="alert" hidden></p></div>
          <div class="form-field"><label for="initial-stock">在庫（初期値）</label><div class="number-field"><input id="initial-stock" aria-describedby="quantity-error" disabled name="initial-stock" type="number" min="0" step="1" value="0" inputmode="numeric"><span>個</span></div><p id="quantity-error" class="field-error" role="alert" hidden></p></div>
          <div class="form-field"><label for="reorder-point">発注点</label><div class="number-field"><input id="reorder-point" aria-describedby="reorder-error reorder-help" disabled name="reorder-point" type="number" min="0" step="1" value="0" inputmode="numeric"><span>個</span></div><p id="reorder-error" class="field-error" role="alert" hidden></p><p id="reorder-help" class="field-help">この数量以下になったら買い物リストに表示されます。</p></div>
          <p id="form-message" class="field-help" role="alert" hidden></p>
          <button class="add-button" type="button" disabled>追加</button><button id="edit-cancel" class="edit-cancel" type="button" hidden>編集をキャンセル</button>
        </div>
      </section>
      <section id="settings" class="screen" aria-labelledby="settings-title" hidden>
        <h1 id="settings-title">設定</h1>
        <section class="data-management" aria-labelledby="data-management-title">
          <h2 id="data-management-title">データ管理</h2>
          <p class="field-help">商品データをJSONファイルで保存・復元します。保存後は実際のファイルを選び直して確認してください。</p>
          <p id="data-message" class="field-help" role="status" aria-live="polite" hidden></p>
          <div class="data-actions">
            <button id="backup-export" type="button">バックアップを書き出す</button>
            <button id="restore-select" type="button">バックアップから復元する</button>
            <button id="restore-confirm" type="button" hidden>このバックアップから復元する</button>
            <button id="backup-verify" type="button" hidden>保存したバックアップを確認</button>
            <button id="restore-finish" type="button" hidden>保存完了</button>
            <button id="data-abort" type="button" hidden>復元中断</button>
          </div>
          <input id="backup-file" type="file" accept=".json,application/json" hidden aria-label="バックアップJSONファイルを選択">
        </section>
      </section>
    </main>
  </div>
  <nav class="bottom-nav" aria-label="メインナビゲーション">
    <div class="nav-inner">
      <button type="button" class="nav-button is-active" data-screen="inventory" aria-controls="inventory" aria-current="page"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 10h18M9 4v6M9 15h6"/></svg><span>在庫</span></button>
      <button type="button" class="nav-button" data-screen="shopping" aria-controls="shopping"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 7h14l1 14H4L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/></svg><span>買い物</span></button>
      <button type="button" class="nav-button" data-screen="add" aria-controls="add"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="6"/><path d="M12 7v10M7 12h10"/></svg><span>追加</span></button>
      <button type="button" class="nav-button" data-screen="settings" aria-controls="settings"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></svg><span>設定</span></button>
    </div>
  </nav>
</body>
</html>
